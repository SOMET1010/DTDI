<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PASS Academy</title><style>:root{font-family:Arial,sans-serif;color:#17233c;background:#fffaf0}*{box-sizing:border-box}body{margin:0;background:#fffaf0}.top{padding:14px 18px;display:flex;align-items:center;font-weight:900}.logo{background:#08783e;color:#fff;border-radius:14px;padding:11px;margin-right:9px}.ver{margin-left:auto;font-size:11px;color:#788}.wrap{padding:4px 16px 90px}.screen{display:none}.screen.on{display:block}.welcome{background:linear-gradient(145deg,#fff0a8,#ffd36c);border-radius:30px;padding:20px;text-align:center}.art svg{width:100%;height:100%;display:block}.sutaFace{width:145px;height:145px;margin:auto;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}.talk,.primary{width:78px;height:78px;border:0;border-radius:50%;background:#08783e;color:#fff;font-size:34px}.continue{display:block;width:100%;border:0;background:#0a9a43;color:#fff;border-radius:22px;padding:18px;font-size:34px}.section{font-size:17px;margin:22px 3px 10px}.rail{display:flex;gap:12px;overflow:auto;padding-bottom:9px}.card{min-width:62%;border:0;background:#fff;border-radius:24px;padding:14px;text-align:center}.card .art{width:130px;height:130px;margin:auto}.card h3{font-size:15px}.listenMini{width:52px;height:52px;border:0;border-radius:50%;background:#f08224;color:#fff;font-size:23px}.window{background:#fff;border-radius:28px;padding:16px;min-height:76vh}.back{width:54px;height:54px;border:0;border-radius:50%;background:#e9f0f6;color:#2256a3;font-size:25px}.scene{text-align:center}.personBig{width:210px;height:210px;margin:auto}.sceneIcon{font-size:50px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.choice{min-height:145px;border:3px solid #edf0e8;background:#fffdf7;border-radius:24px;font-size:48px;padding:10px}.choice span,.textOptional{display:block;font-size:12px;color:#687487}.success{display:none;text-align:center;background:#effbea;border-radius:25px;padding:20px;margin-top:16px}.success .big{font-size:72px}.success button,.sceneNext{width:90px;height:90px;border:0;border-radius:50%;background:#0a9a43;color:#fff;font-size:42px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:9px 22px;display:flex;justify-content:space-around}.nav button{width:58px;height:52px;border:0;background:none;font-size:27px}.zeroRead .textOptional,.zeroRead h3{opacity:.18}.mode{border:0;border-radius:99px;background:#fff;padding:8px 11px;margin-left:8px}.badge{display:inline-block;background:#fff1df;color:#8f4f1c;border-radius:99px;padding:6px 10px;font-size:11px}.pilot{background:linear-gradient(180deg,#eef7ff,#fff9e9);border-radius:26px;padding:12px;text-align:center}.pilot .stage{min-height:365px;display:flex;flex-direction:column;justify-content:center}.pilot .cue{font-size:48px;margin:8px}.pilot .dots{display:flex;justify-content:center;gap:7px;margin:8px}.pilot .dots i{width:11px;height:11px;border-radius:50%;background:#d8dde5}.pilot .dots i.on{background:#08783e}.pilotChoice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pilotChoice button{min-height:125px;border:3px solid #fff;background:#fff;border-radius:22px;font-size:43px}.wrong{animation:shake .35s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.celebrate{font-size:76px;animation:pop .55s}@keyframes pop{50%{transform:scale(1.25)}}</style></head><body><div class="top"><span class="logo">P</span>PASS Academy<span class="ver">V1.3 Cartoon</span><button class="mode" onclick="toggleRead()">👁️</button></div><main class="wrap" id="app"><section id="home" class="screen on"><div class="welcome"><div class="sutaFace art" id="sutaArt"></div><button class="talk" onclick="welcomeVoice()">🔊</button><p class="textOptional">SUTA te guide avec sa voix.</p><button class="continue" id="continue">▶️</button></div><div class="section textOptional">Choisis une histoire avec l’image</div><div class="rail" id="rail"></div></section><section id="detail" class="screen"><div class="window"><button class="back" onclick="goHome()">←</button><div id="content"></div></div></section></main><nav class="nav"><button onclick="goHome()">🏠</button><button onclick="sutaHelp()">🧑🏾‍🏫</button><button onclick="showProgress()">🏆</button></nav><script src="art/cartoon-v13.js"></script><script src="content/stories-v13.js"></script><script src="content/ejustice-pilot-v13.js"></script><script>const stories=window.PASS_STORIES||[],art=window.PASS_ART||{};let progress=JSON.parse(localStorage.getItem('passProgress')||'{}'),pilotIndex=0;const artKey={"Tata Nanti":"tata","Mariam":"mariam","Yao":"yao","Konan":"konan","Awa":"awa","Fatou":"fatou","Adama":"adama","Issa":"issa"};document.getElementById('sutaArt').innerHTML=art.suta||'';function personArt(s){return art[artKey[s.character]]||art.suta||''}function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}function nextStory(){return stories.find(s=>!progress[s.id])||stories[0]}function card(s){let b=document.createElement('button');b.className='card';b.onclick=()=>openStory(s);b.innerHTML='<div class="art">'+personArt(s)+'</div><h3>'+s.character+'</h3><span class="badge">'+s.icon+' '+s.skill+'</span><br><button class="listenMini">🔊</button>';b.querySelector('.listenMini').onclick=e=>{e.stopPropagation();speak(s.character+'. '+s.intro)};return b}stories.forEach(s=>document.getElementById('rail').appendChild(card(s)));function welcomeVoice(){speak('Bonjour. Je suis SUTA. Touche le grand bouton vert pour continuer, ou touche un personnage.')}function refresh(){document.getElementById('continue').onclick=()=>openStory(nextStory())}function openStory(s){document.getElementById('home').classList.remove('on');document.getElementById('detail').classList.add('on');if(s.id==='ejustice'){pilotIndex=0;renderPilot();return}renderBasic(s)}function renderPilot(){let p=window.PASS_EJUSTICE_PILOT,sc=p.scenes[pilotIndex],dots=p.scenes.map((x,i)=>'<i class="'+(i===pilotIndex?'on':'')+'"></i>').join(''),controls='';if(sc.action==='choice')controls='<div class="pilotChoice">'+sc.choices.map((c,i)=>'<button onclick="pilotAnswer('+i+')">'+c.visual+'</button>').join('')+'</div>';else if(sc.action==='next')controls='<button class="sceneNext" onclick="pilotNext()">▶️</button>';else controls='<div class="celebrate">🎉</div><button class="sceneNext" onclick="finish(\'ejustice\')">✓</button>';document.getElementById('content').innerHTML='<div class="pilot"><div class="dots">'+dots+'</div><div class="stage"><div class="personBig art">'+(art.adama||'')+'</div><div class="sceneIcon">'+sc.icon+'</div><div class="cue">'+sc.cue+'</div><button class="primary" onclick="pilotSpeak()">🔊</button><p class="textOptional">'+sc.voice+'</p></div>'+controls+'</div>';setTimeout(()=>speak(sc.voice),300)}function pilotSpeak(){speak(window.PASS_EJUSTICE_PILOT.scenes[pilotIndex].voice)}function pilotNext(){pilotIndex=Math.min(pilotIndex+1,window.PASS_EJUSTICE_PILOT.scenes.length-1);renderPilot()}function pilotAnswer(i){let sc=window.PASS_EJUSTICE_PILOT.scenes[pilotIndex],c=sc.choices[i];speak(c.voice);if(c.good)setTimeout(pilotNext,700);else{let el=document.querySelectorAll('.pilotChoice button')[i];el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),450);setTimeout(()=>speak('Attention. Essaie l’autre image.'),650)}}function renderBasic(s){let visual=s.choices.map((c,i)=>'<button class="choice" data-i="'+i+'>'+((c.match(/^[^A-Za-zÀ-ÿ0-9]+/)||['●'])[0])+'<span>'+c+'</span></button>').join('');document.getElementById('content').innerHTML='<div class="scene"><div class="personBig art">'+personArt(s)+'</div><div class="sceneIcon">'+s.icon+'</div><h3>'+s.character+'</h3><button class="primary" id="hear">🔊</button><p class="textOptional">'+s.intro+'</p></div><div class="choices">'+visual+'</div><div class="success" id="success"><div class="big">🎉</div><button onclick="finish(\''+s.id+'\')">✓</button><p class="textOptional">'+s.success+'</p></div>';document.getElementById('hear').onclick=()=>speak(s.intro+' '+s.problem);document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>answer(s,Number(x.dataset.i)));setTimeout(()=>speak(s.intro+' '+s.problem),350)}function answer(s,i){if(i===s.answer){document.getElementById('success').style.display='block';speak(s.success)}else speak('Essaie encore.')}function finish(id){progress[id]=true;localStorage.setItem('passProgress',JSON.stringify(progress));speak('Bravo. Histoire terminée.');setTimeout(goHome,800)}function goHome(){document.getElementById('detail').classList.remove('on');document.getElementById('home').classList.add('on');refresh()}function sutaHelp(){speak('Je suis SUTA. Touche le haut-parleur pour m’écouter et les grandes images pour choisir.')}function showProgress(){speak('Tu as terminé '+Object.keys(progress).length+' histoires.')}function toggleRead(){document.getElementById('app').classList.toggle('zeroRead');speak('Mode test sans lecture.')}refresh();setTimeout(welcomeVoice,600);</script></body></html>
