<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PASS Academy</title><style>:root{font-family:Arial,sans-serif;color:#17233c;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}.hero{background:#2256a3;color:#fff;padding:18px 18px 24px;border-radius:0 0 28px 28px}.brand{font-weight:900;display:flex;align-items:center}.brand b{background:#f08224;padding:11px;border-radius:13px;margin-right:9px}.ver{margin-left:auto;font-size:12px}.suta{display:flex;gap:12px;align-items:center;margin-top:20px}.avatar{font-size:44px;background:#fff;border-radius:50%;padding:12px}.bubble{background:#fff;color:#17233c;border-radius:18px;padding:13px;font-weight:700}.wrap{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:0;border-radius:20px;padding:15px;text-align:left;box-shadow:0 4px 15px #0001}.card .ico{font-size:38px}.card h3{margin:8px 0 4px}.card small{color:#6b7485}.who{display:block;margin-top:9px;color:#a45517;font-weight:800}.screen{display:none}.screen.on{display:block}.story{background:#fff;border-radius:22px;padding:17px}.back,.listen,.choice,.next{border:0;border-radius:14px;padding:13px;font-weight:800}.back{background:#e9eff8;color:#2256a3}.scene{text-align:center;background:#eef5ff;border-radius:20px;padding:17px;margin-top:14px}.person{font-size:66px}.listen{background:#f08224;color:#fff}.choice{display:block;width:100%;background:#f6f8fb;text-align:left;margin:9px 0;font-size:16px}.feedback{display:none;background:#eff9f1;padding:14px;border-radius:14px}.next{width:100%;background:#2e9d55;color:#fff;margin-top:10px}.privacy{text-align:center;color:#7a8393;font-size:11px;margin:22px}.progress{height:7px;background:#ffffff33;border-radius:9px;margin-top:14px}.progress i{display:block;height:100%;background:#f4ad55;width:0}</style></head><body><header class="hero"><div class="brand"><b>P</b>PASS Academy<span class="ver">V1.2</span></div><div class="suta"><div class="avatar">🧑🏾‍🏫</div><div class="bubble">Je suis SUTA. Choisis une histoire et aide le personnage.</div></div><div class="progress"><i id="bar"></i></div></header><main class="wrap"><section id="home" class="screen on"><h2>Choisis une histoire</h2><p>Apprends en aidant quelqu’un dans une situation réelle.</p><div id="grid" class="grid"></div><div class="privacy">🔒 Tes apprentissages ne changent jamais ton éligibilité PASS.</div></section><section id="detail" class="screen"><div class="story"><button class="back" onclick="goHome()">← Histoires</button><div id="content"></div></div></section></main><script src="content/stories-v12.js"></script><script>let progress=JSON.parse(localStorage.getItem('passProgress')||'{}');const stories=window.PASS_STORIES||[],grid=document.getElementById('grid');stories.forEach(s=>{let b=document.createElement('button');b.className='card';b.onclick=()=>openStory(s);b.innerHTML='<div class="ico">'+s.icon+'</div><h3>'+s.title+'</h3><small>'+s.category+'</small><span class="who">Avec '+s.character+'</span>';grid.appendChild(b)});function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}catch(e){}}function openStory(s){document.getElementById('home').classList.remove('on');document.getElementById('detail').classList.add('on');let chapters=s.chapters?'<p><b>Dans cette histoire :</b></p><ul>'+s.chapters.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'';document.getElementById('content').innerHTML='<div class="scene"><div class="person">'+s.avatar+'</div><h1>'+s.character+'</h1><h3>'+s.title+'</h3><p>'+s.intro+'</p><button class="listen" id="listen">🔊 Écouter l’histoire</button></div>'+chapters+'<h2>🤔 Aide '+s.character+'</h2><p>'+s.problem+'</p>'+s.choices.map((c,i)=>'<button class="choice" data-i="'+i+'">'+c+'</button>').join('')+'<div class="feedback" id="feedback"><b>'+s.success+'</b><button class="next" onclick="finish(\''+s.id+'\')">Continuer ✓</button></div>';document.getElementById('listen').onclick=()=>speak(s.intro);document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>answer(s,Number(x.dataset.i)));speak(s.intro)}function answer(s,i){if(i===s.answer){document.getElementById('feedback').style.display='block';speak(s.success)}else speak('Essaie encore. SUTA est avec toi.')}function finish(id){progress[id]=true;localStorage.setItem('passProgress',JSON.stringify(progress));update();speak('Bravo. Histoire terminée.');setTimeout(goHome,600)}function goHome(){document.getElementById('detail').classList.remove('on');document.getElementById('home').classList.add('on')}function update(){document.getElementById('bar').style.width=(stories.length?Math.round(Object.keys(progress).length/stories.length*100):0)+'%'}update();</script></body></html>
