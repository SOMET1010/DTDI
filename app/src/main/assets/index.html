<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PASS Academy</title><style>:root{font-family:Arial,sans-serif;color:#17233c;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;background:#f6f8fb}.hero{background:linear-gradient(150deg,#2256a3,#173b74);color:#fff;padding:18px 18px 28px;border-radius:0 0 32px 32px}.brand{display:flex;align-items:center;font-weight:800}.mark{width:42px;height:42px;border-radius:14px;background:#f08224;display:grid;place-items:center;margin-right:10px;font-size:21px}.version{margin-left:auto;font-size:12px;opacity:.8}.suta-hero{display:flex;align-items:center;gap:15px;margin-top:24px}.avatar{width:88px;height:88px;border-radius:50%;background:#fff;color:#2256a3;border:5px solid #ffffff33;display:grid;place-items:center;font-size:43px;box-shadow:0 8px 25px #0003}.bubble{flex:1;background:#fff;color:#17233c;border-radius:20px 20px 20px 5px;padding:14px;font-size:17px;font-weight:700;line-height:1.3}.listen{border:0;background:#f08224;color:#fff;border-radius:999px;padding:12px 17px;font-weight:800;margin-top:12px}.wrap{padding:18px}.lang{display:flex;gap:9px;overflow:auto;margin-bottom:17px}.lang button{white-space:nowrap;border:1px solid #dbe3ef;background:#fff;padding:10px 14px;border-radius:999px;font-weight:700}.lang .on{background:#2256a3;color:#fff;border-color:#2256a3}.title{font-size:22px;margin:8px 0 4px}.sub{color:#69748a;margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{border:0;text-align:left;background:#fff;border-radius:22px;padding:17px;min-height:175px;box-shadow:0 5px 18px #17335d12;color:#17233c}.card:active{transform:scale(.98)}.ico{font-size:42px}.card h3{font-size:18px;margin:10px 0 5px}.card p{font-size:13px;color:#667187;line-height:1.35;margin:0}.tag{display:inline-block;margin-top:10px;background:#edf4ff;color:#2256a3;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:800}.screen{display:none}.screen.on{display:block}.lesson{background:#fff;border-radius:24px;padding:19px}.back{border:0;background:#eaf0f8;color:#2256a3;border-radius:12px;padding:11px 14px;font-weight:800}.lesson-ico{font-size:58px;margin:22px 0 8px}.steps{margin:18px 0}.step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f5}.num{width:34px;height:34px;border-radius:50%;background:#f08224;color:#fff;display:grid;place-items:center;font-weight:900;flex:none}.step b{display:block;margin-bottom:4px}.step small{color:#748095}.action{width:100%;border:0;background:#2e9d55;color:#fff;padding:16px;border-radius:16px;font-size:16px;font-weight:900}.progress{height:8px;background:#ffffff2b;border-radius:99px;margin-top:17px;overflow:hidden}.progress i{display:block;height:100%;background:#f6b25f;width:0}.privacy{font-size:11px;color:#788399;text-align:center;margin:20px 12px 85px}.mic{position:fixed;right:18px;bottom:18px;width:64px;height:64px;border:0;border-radius:50%;background:#f08224;color:#fff;font-size:26px;box-shadow:0 8px 25px #9a4b1166}</style></head><body><header class="hero"><div class="brand"><div class="mark">P</div>PASS Academy<span class="version">V1 Preview</span></div><div class="suta-hero"><div class="avatar">🧑🏾‍🏫</div><div><div class="bubble" id="bubble">Bonjour ! Je suis SUTA. Qu’est-ce que tu veux apprendre aujourd’hui ?</div><button class="listen" onclick="speak(document.getElementById('bubble').innerText)">🔊 Écouter SUTA</button></div></div><div class="progress"><i id="bar"></i></div></header><main class="wrap"><section id="home" class="screen on"><div class="lang"><button class="on">🇨🇮 Français</button><button onclick="setLang('dioula')">🗣️ Dioula</button><button>＋ Langues</button></div><h2 class="title">Choisis avec l’image</h2><p class="sub">Tu peux aussi toucher le micro et parler à SUTA.</p><div class="grid" id="grid"></div><div class="privacy">🔒 La formation n’influence jamais ton éligibilité au programme PASS.</div></section><section id="detail" class="screen"><div class="lesson"><button class="back" onclick="home()">← Retour</button><div id="content"></div></div></section></main><button class="mic" onclick="suta()">🎙️</button><script>const modules=[['phone','📱','Mon téléphone','Apprendre les gestes essentiels',['Trouve les boutons du téléphone','Règle le volume','Ouvre l’appareil photo','Prends une photo']],['talk','💬','Ma famille','Appeler et envoyer des messages',['Enregistre un contact','Passe un appel','Envoie une note vocale','Fais un appel vidéo']],['web','🌍','Internet','Chercher et comprendre Internet',['Active le Wi-Fi','Fais une recherche','Regarde une vidéo','Économise tes données']],['safe','🛡️','Me protéger','Éviter les arnaques et protéger mes codes',['Crée un code secret','Repère un message suspect','Ne partage jamais ton code','Demande de l’aide avant de cliquer']],['money','💰','Mon argent','Utiliser Mobile Money sans risque',['Vérifie le nom','Vérifie le montant','Confirme seulement si tout est bon','Garde la preuve']],['use','🌱','Ma vie quotidienne','Agriculture, école, emploi et services',['Cherche une information utile','Apprends quelque chose','Trouve un service','Demande à SUTA']]];let progress=JSON.parse(localStorage.getItem('passProgress')||'{}');const grid=document.getElementById('grid');modules.forEach(m=>{let b=document.createElement('button');b.className='card';b.onclick=()=>openModule(m);b.innerHTML=`<div class="ico">${m[1]}</div><h3>${m[2]}</h3><p>${m[3]}</p><span class="tag">👂 Écouter · 👆 Faire</span>`;grid.appendChild(b)});function updateBar(){document.getElementById('bar').style.width=Math.round(Object.keys(progress).length/modules.length*100)+'%'}function openModule(m){document.getElementById('home').classList.remove('on');document.getElementById('detail').classList.add('on');document.getElementById('content').innerHTML=`<div class="lesson-ico">${m[1]}</div><h1>${m[2]}</h1><p>${m[3]}</p><button class="listen" onclick="speak('${m[2]}. ${m[3]}')">🔊 Écouter</button><div class="steps">${m[4].map((x,i)=>`<div class="step"><div class="num">${i+1}</div><div><b>${x}</b><small>Écoute · regarde · fais sur ton téléphone</small></div></div>`).join('')}</div><button class="action" onclick="finish('${m[0]}')">✓ J’ai réussi</button>`}function home(){document.getElementById('detail').classList.remove('on');document.getElementById('home').classList.add('on')}function finish(id){progress[id]=true;localStorage.setItem('passProgress',JSON.stringify(progress));updateBar();speak('Bravo ! Tu as réussi.');setTimeout(home,500)}function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.88;speechSynthesis.speak(u)}catch(e){}}function suta(){let t='Dis-moi ce que tu veux apprendre. Tu peux commencer par ton téléphone, Internet, ta sécurité ou ton argent.';document.getElementById('bubble').innerText=t;speak(t)}function setLang(l){let t='An ka kalan daminɛ. SUTA bɛ i dɛmɛ.';document.getElementById('bubble').innerText=t;speak(t)}updateBar();</script></body></html>
