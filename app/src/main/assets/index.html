<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PASS Academy</title><style>:root{font-family:Arial,sans-serif;color:#17233c;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;background:#f6f8fb}.top{padding:18px 18px 8px;display:flex;align-items:center;font-weight:900}.logo{background:#2256a3;color:#fff;border-radius:13px;padding:11px;margin-right:9px}.ver{margin-left:auto;font-size:11px;color:#758095}.wrap{padding:10px 18px 90px}.screen{display:none}.screen.on{display:block}.welcome{background:linear-gradient(145deg,#2256a3,#183c75);color:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 30px #17335d22}.suta{display:flex;gap:14px;align-items:center}.avatar{width:70px;height:70px;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:38px}.welcome h1{font-size:24px;margin:0 0 5px}.welcome p{margin:0;line-height:1.4}.continue{margin-top:18px;background:#fff;color:#2256a3;border:0;border-radius:18px;width:100%;padding:17px;font-size:17px;font-weight:900;text-align:left}.continue small{display:block;color:#73809a;margin-top:4px}.section{margin:24px 2px 12px;font-size:19px}.rail{display:flex;gap:12px;overflow:auto;padding:2px 1px 10px;scroll-snap-type:x mandatory}.card{min-width:72%;scroll-snap-align:start;border:0;background:#fff;border-radius:22px;padding:17px;text-align:left;box-shadow:0 5px 18px #0000000c}.card .ico{font-size:40px}.card h3{font-size:18px;margin:9px 0 4px}.meta{color:#778197;font-size:12px}.who{display:inline-block;margin-top:10px;background:#fff1df;color:#914e15;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:800}.dots{text-align:center;color:#a4adba}.window{background:#fff;border-radius:28px;padding:18px;box-shadow:0 8px 26px #0000000b;min-height:70vh}.back{border:0;background:#edf2f8;color:#2256a3;border-radius:14px;padding:12px 14px;font-weight:900}.scene{text-align:center;padding:15px 6px}.person{font-size:78px}.scene h1{margin:4px}.scene p{font-size:18px;line-height:1.45}.primary{width:100%;border:0;border-radius:18px;background:#f08224;color:#fff;padding:16px;font-size:17px;font-weight:900}.step{font-size:12px;color:#778197;text-align:center;margin:13px}.choice{width:100%;border:2px solid #edf0f5;background:#fff;border-radius:18px;padding:16px;text-align:left;margin:8px 0;font-size:16px;font-weight:800}.success{display:none;text-align:center;background:#effaf2;border-radius:22px;padding:20px;margin-top:15px}.success .big{font-size:48px}.success button{width:100%;border:0;background:#2e9d55;color:#fff;border-radius:16px;padding:15px;font-weight:900;margin-top:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8ecf2;padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav button{border:0;background:none;font-size:12px;color:#657087;font-weight:800}.nav b{display:block;font-size:22px;margin-bottom:2px}.privacy{text-align:center;color:#8992a1;font-size:11px;margin:22px}</style></head><body><div class="top"><span class="logo">P</span>PASS Academy<span class="ver">V1.3</span></div><main class="wrap"><section id="home" class="screen on"><div class="welcome"><div class="suta"><div class="avatar">🧑🏾‍🏫</div><div><h1>Bonjour 👋</h1><p id="hello">Je suis SUTA. On continue ensemble ?</p></div></div><button class="continue" id="continue">▶ Continuer mon histoire<small id="nextLabel">Quelques minutes pour apprendre quelque chose d’utile</small></button></div><h2 class="section">Pour toi aujourd’hui</h2><div class="rail" id="rail"></div><div class="dots">● ○ ○</div><h2 class="section">Explorer</h2><div class="rail" id="more"></div><div class="privacy">🔒 Ta formation reste séparée de ton éligibilité PASS.</div></section><section id="detail" class="screen"><div class="window"><button class="back" onclick="goHome()">← Retour</button><div id="content"></div></div></section></main><nav class="nav"><button onclick="goHome()"><b>⌂</b>Accueil</button><button onclick="speak('Choisis une histoire. Je suis là pour t’aider.')"><b>🧑🏾‍🏫</b>SUTA</button><button onclick="showProgress()"><b>✓</b>Mes progrès</button></nav><script src="content/stories-v13.js"></script><script>const stories=window.PASS_STORIES||[];let progress=JSON.parse(localStorage.getItem('passProgress')||'{}');let last=localStorage.getItem('passLast')||'';function nextStory(){return stories.find(s=>!progress[s.id])||stories[0]}function card(s){let b=document.createElement('button');b.className='card';b.onclick=()=>openStory(s);b.innerHTML='<div class="ico">'+s.icon+'</div><h3>'+s.title+'</h3><div class="meta">'+s.duration+' · '+s.skill+'</div><span class="who">Avec '+s.character+'</span>';return b}stories.slice(0,5).forEach(s=>document.getElementById('rail').appendChild(card(s)));stories.slice(5).forEach(s=>document.getElementById('more').appendChild(card(s)));function refresh(){let n=nextStory();document.getElementById('nextLabel').innerText=n.character+' · '+n.title+' · '+n.duration;document.getElementById('continue').onclick=()=>openStory(n);let done=Object.keys(progress).length;document.getElementById('hello').innerText=done?'Tu as déjà terminé '+done+' histoire'+(done>1?'s':'')+'. On continue ?':'Je suis SUTA. On commence doucement, une histoire à la fois.'}function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.86;speechSynthesis.speak(u)}catch(e){}}function openStory(s){last=s.id;localStorage.setItem('passLast',s.id);document.getElementById('home').classList.remove('on');document.getElementById('detail').classList.add('on');document.getElementById('content').innerHTML='<div class="step">1 histoire · 1 problème · 1 action</div><div class="scene"><div class="person">'+s.avatar+'</div><h1>'+s.character+'</h1><h3>'+s.title+'</h3><p>'+s.intro+'</p></div><button class="primary" id="listen">🔊 Écouter SUTA</button><div class="step">Aide '+s.character+'</div><h2>'+s.problem+'</h2>'+s.choices.map((c,i)=>'<button class="choice" data-i="'+i+'">'+c+'</button>').join('')+'<div class="success" id="success"><div class="big">🎉</div><h2>Bravo !</h2><p>'+s.success+'</p><button onclick="finish(\''+s.id+'\')">J’ai compris ✓</button></div>';document.getElementById('listen').onclick=()=>speak(s.intro);document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>answer(s,Number(x.dataset.i)));speak(s.intro)}function answer(s,i){if(i===s.answer){document.getElementById('success').style.display='block';speak(s.success)}else speak('Essaie encore. Regarde bien les choix. Je suis avec toi.')}function finish(id){progress[id]=true;localStorage.setItem('passProgress',JSON.stringify(progress));refresh();speak('Bravo. À bientôt pour la prochaine histoire.');setTimeout(goHome,700)}function goHome(){document.getElementById('detail').classList.remove('on');document.getElementById('home').classList.add('on');refresh()}function showProgress(){let d=Object.keys(progress).length;speak('Tu as terminé '+d+' histoires sur '+stories.length+'. Bravo.');alert('🎉 '+d+' histoires terminées sur '+stories.length)}refresh();</script></body></html>
