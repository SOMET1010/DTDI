<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PASS Academy</title><style>:root{font-family:Arial,sans-serif;color:#17233c;background:#fffaf0}*{box-sizing:border-box}body{margin:0;background:#fffaf0}.top{padding:14px 18px;display:flex;align-items:center;font-weight:900}.logo{background:#08783e;color:#fff;border-radius:14px;padding:11px;margin-right:9px}.ver{margin-left:auto;font-size:11px;color:#788}.wrap{padding:4px 16px 90px}.screen{display:none}.screen.on{display:block}.welcome{background:linear-gradient(145deg,#fff0a8,#ffd36c);border-radius:30px;padding:20px;box-shadow:0 12px 30px #8b671522;text-align:center}.sutaFace{font-size:82px;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}.talk{width:78px;height:78px;border:0;border-radius:50%;background:#08783e;color:#fff;font-size:34px;box-shadow:0 7px 18px #08783e44;margin:8px}.continue{display:block;width:100%;border:0;background:#0a9a43;color:#fff;border-radius:22px;padding:18px;font-size:34px;font-weight:900}.hint{font-size:13px;margin:7px;color:#675}.section{font-size:17px;margin:22px 3px 10px}.rail{display:flex;gap:12px;overflow:auto;scroll-snap-type:x mandatory;padding-bottom:9px}.card{min-width:62%;scroll-snap-align:start;border:0;background:#fff;border-radius:24px;padding:14px;box-shadow:0 5px 18px #0001;text-align:center}.card .person{font-size:66px}.card .ico{font-size:38px}.card h3{font-size:15px;margin:6px}.listenMini{width:52px;height:52px;border:0;border-radius:50%;background:#f08224;color:#fff;font-size:23px}.window{background:#fff;border-radius:28px;padding:16px;min-height:76vh}.back{width:54px;height:54px;border:0;border-radius:50%;background:#e9f0f6;color:#2256a3;font-size:25px}.scene{text-align:center}.personBig{font-size:110px}.storyIcon{font-size:50px}.primary{width:82px;height:82px;border:0;border-radius:50%;background:#08783e;color:#fff;font-size:36px;box-shadow:0 8px 20px #08783e44}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.choice{min-height:145px;border:3px solid #edf0e8;background:#fffdf7;border-radius:24px;font-size:48px;padding:10px}.choice span{display:block;font-size:12px;margin-top:8px}.success{display:none;text-align:center;background:#effbea;border-radius:25px;padding:20px;margin-top:16px}.success .big{font-size:72px}.success button{width:90px;height:90px;border:0;border-radius:50%;background:#0a9a43;color:#fff;font-size:42px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:9px 22px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav button{width:58px;height:52px;border:0;background:none;font-size:27px}.textOptional{font-size:13px;color:#687487}.zeroRead .textOptional,.zeroRead h3{opacity:.18}.mode{border:0;border-radius:99px;background:#fff;padding:8px 11px;margin-left:8px}</style></head><body><div class="top"><span class="logo">P</span>PASS Academy<span class="ver">V1.3 Zéro lecture</span><button class="mode" onclick="toggleRead()">👁️</button></div><main class="wrap" id="app"><section id="home" class="screen on"><div class="welcome"><div class="sutaFace">🧑🏾‍🏫</div><button class="talk" onclick="welcomeVoice()">🔊</button><div class="textOptional">SUTA te guide avec sa voix.</div><button class="continue" id="continue">▶️</button><div class="hint textOptional">Continuer</div></div><div class="section textOptional">Choisis une histoire avec l’image</div><div class="rail" id="rail"></div></section><section id="detail" class="screen"><div class="window"><button class="back" onclick="goHome()">←</button><div id="content"></div></div></section></main><nav class="nav"><button onclick="goHome()">🏠</button><button onclick="sutaHelp()">🧑🏾‍🏫</button><button onclick="showProgress()">🏆</button></nav><script src="content/stories-v13.js"></script><script>const stories=window.PASS_STORIES||[];let progress=JSON.parse(localStorage.getItem('passProgress')||'{}');function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}function voiceChoice(c){return c.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,'').trim()}function nextStory(){return stories.find(s=>!progress[s.id])||stories[0]}function card(s){let b=document.createElement('button');b.className='card';b.onclick=()=>openStory(s);b.innerHTML='<div class="person">'+s.avatar+'</div><div class="ico">'+s.icon+'</div><h3>'+s.character+'</h3><button class="listenMini" aria-label="Ecouter">🔊</button>';b.querySelector('.listenMini').onclick=e=>{e.stopPropagation();speak(s.character+'. '+s.intro)};return b}stories.forEach(s=>document.getElementById('rail').appendChild(card(s)));function welcomeVoice(){speak('Bonjour. Je suis SUTA. Je vais t’aider. Touche le grand bouton vert pour continuer, ou touche une image pour choisir une histoire.')}function refresh(){document.getElementById('continue').onclick=()=>openStory(nextStory())}function openStory(s){document.getElementById('home').classList.remove('on');document.getElementById('detail').classList.add('on');let visual=s.choices.map((c,i)=>'<button class="choice" data-i="'+i+'">'+c.match(/^[^A-Za-zÀ-ÿ0-9]+/)?.[0]+'<span class="textOptional">'+c+'</span></button>').join('');document.getElementById('content').innerHTML='<div class="scene"><div class="personBig">'+s.avatar+'</div><div class="storyIcon">'+s.icon+'</div><h3>'+s.character+'</h3><button class="primary" id="hear">🔊</button><p class="textOptional">'+s.intro+'</p></div><div class="choices">'+visual+'</div><div class="success" id="success"><div class="big">🎉</div><button onclick="finish(\''+s.id+'\')">✓</button><p class="textOptional">'+s.success+'</p></div>';document.getElementById('hear').onclick=()=>speak(s.intro+' '+s.problem+' Touche une image pour répondre.');document.querySelectorAll('.choice').forEach(x=>{x.onclick=()=>answer(s,Number(x.dataset.i));x.ontouchstart=()=>speak(voiceChoice(s.choices[Number(x.dataset.i)]))});setTimeout(()=>speak(s.intro+' '+s.problem+' Touche une image pour répondre.'),350)}function answer(s,i){if(i===s.answer){document.getElementById('success').style.display='block';speak(s.success+' Bravo. Touche la coche verte.')}else{speak('Ce n’est pas le meilleur choix. Essaie une autre image.')}}function finish(id){progress[id]=true;localStorage.setItem('passProgress',JSON.stringify(progress));speak('Bravo. Histoire terminée.');setTimeout(goHome,700)}function goHome(){document.getElementById('detail').classList.remove('on');document.getElementById('home').classList.add('on');refresh()}function sutaHelp(){speak('Je suis SUTA. Touche le haut-parleur pour m’écouter. Touche les grandes images pour choisir.')}function showProgress(){let d=Object.keys(progress).length;speak('Bravo. Tu as terminé '+d+' histoires.')}function toggleRead(){document.getElementById('app').classList.toggle('zeroRead');speak('Mode test sans lecture. Utilise seulement les images et ma voix.')}refresh();setTimeout(welcomeVoice,600);</script></body></html>
