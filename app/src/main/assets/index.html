<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PASS Academy</title>
<style>
:root{font-family:Arial,sans-serif;color:#17233c;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;background:#f6f8fb}.top{background:#2256a3;color:white;padding:20px 18px 26px;border-radius:0 0 26px 26px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:38px;height:38px;border-radius:12px;background:#f08224;display:grid;place-items:center}.top h1{font-size:27px;margin:24px 0 8px}.top p{opacity:.9;line-height:1.4;margin:0}.wrap{padding:18px}.notice{background:#fff4df;border:1px solid #f0d7a8;padding:12px;border-radius:14px;font-size:13px;line-height:1.35;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border-radius:18px;padding:16px;min-height:160px;box-shadow:0 3px 14px #17335d12}.ico{font-size:31px}.card h3{margin:10px 0 5px;font-size:17px}.card p{margin:0;color:#5c667b;font-size:13px;line-height:1.35}.lesson{display:none;background:white;border-radius:18px;padding:18px;margin-top:12px}.lesson.active{display:block}.back{border:0;background:#e8eef8;color:#2256a3;padding:10px 14px;border-radius:12px;font-weight:700}.steps{margin-top:16px}.step{padding:14px 0;border-bottom:1px solid #edf0f5}.step:last-child{border:0}.step b{display:block;margin-bottom:5px}.step small{color:#687286}.done{width:100%;border:0;background:#2e9d55;color:white;padding:15px;border-radius:14px;font-weight:800;margin-top:14px}.suta{position:fixed;right:18px;bottom:20px;border:0;background:#f08224;color:white;padding:14px 18px;border-radius:999px;font-weight:800;box-shadow:0 6px 20px #0002}.progress{height:8px;background:#dde5f1;border-radius:99px;margin-top:16px;overflow:hidden}.progress i{display:block;height:100%;background:#f08224;width:0}</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">P</div> PASS Academy <span style="margin-left:auto;font-size:12px">V0.3</span></div><h1>Ton téléphone, tes possibilités</h1><p>Des apprentissages courts, concrets et utilisables même sans Internet.</p><div class="progress"><i id="bar"></i></div></header>
<main class="wrap">
<div class="notice">Tes résultats de formation sont séparés de l’éligibilité PASS. Ils ne peuvent pas modifier tes droits au programme.</div>
<section id="home"><h2>Qu’est-ce que tu veux apprendre ?</h2><div class="grid" id="grid"></div></section>
<section id="detail" class="lesson"><button class="back" onclick="home()">← Retour</button><div id="content"></div></section>
</main><button class="suta" onclick="suta()">🎙️ SUTA</button>
<script>
const modules=[
['phone','📱','Mon téléphone','Allumer, charger, régler le volume et prendre une photo',['Reconnaître les boutons','Charger correctement','Régler le son','Prendre une photo']],
['talk','💬','Je communique','Appels, contacts, messages et WhatsApp',['Enregistrer un contact','Envoyer un message','Faire un appel vidéo','Envoyer une note vocale']],
['web','🌐','Internet','Rechercher une information et gérer ses données',['Wi‑Fi ou données mobiles','Faire une recherche','Regarder une vidéo','Économiser son forfait']],
['safe','🛡️','Je me protège','PIN, arnaques, confidentialité et sécurité',['Protéger le téléphone','Reconnaître une arnaque','Ne jamais donner son code secret','Vérifier avant de cliquer']],
['money','💰','Mon argent','Utiliser Mobile Money avec prudence',['Vérifier le destinataire','Confirmer le montant','Garder la preuve','Réagir en cas d’erreur']],
['use','🌱','Le numérique m’est utile','Éducation, agriculture, emploi et services',['Chercher une information utile','Apprendre avec le téléphone','Trouver un service','Demander de l’aide à SUTA']]
];
let progress=JSON.parse(localStorage.getItem('passProgress')||'{}');
const grid=document.getElementById('grid');
modules.forEach(m=>{const d=document.createElement('div');d.className='card';d.onclick=()=>openModule(m);d.innerHTML=`<div class="ico">${m[1]}</div><h3>${m[2]}</h3><p>${m[3]}</p>`;grid.appendChild(d)});
function updateBar(){const n=Object.keys(progress).length;document.getElementById('bar').style.width=Math.round(n/modules.length*100)+'%'}
function openModule(m){document.getElementById('home').style.display='none';const detail=document.getElementById('detail');detail.classList.add('active');document.getElementById('content').innerHTML=`<div style="font-size:46px;margin-top:18px">${m[1]}</div><h2>${m[2]}</h2><p>${m[3]}</p><div class="steps">${m[4].map((x,i)=>`<div class="step"><b>${i+1}. ${x}</b><small>Écouter • regarder • faire</small></div>`).join('')}</div><button class="done" onclick="finish('${m[0]}')">J’ai terminé ce module</button>`}
function home(){document.getElementById('home').style.display='block';document.getElementById('detail').classList.remove('active')}
function finish(id){progress[id]=true;localStorage.setItem('passProgress',JSON.stringify(progress));updateBar();alert('Bravo ! Ta progression est enregistrée sur ce téléphone.');home()}
function suta(){const text='Dis-moi ce que tu veux apprendre.';try{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';speechSynthesis.speak(u)}}catch(e){} alert('SUTA : '+text)}
updateBar();
</script>
</body></html>
