<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PASS Academy</title><link rel="stylesheet" href="css/app.css"></head><body><div class="top"><span class="logo">P</span>PASS Academy<span class="ver">V1.3 Motion</span><button class="mode" onclick="toggleRead()">👁️</button></div><main class="wrap" id="app"><section id="home" class="screen on"><div class="welcome"><div class="sutaFace art" id="sutaArt"></div><button class="talk" onclick="welcomeVoice()">🔊</button><p class="textOptional">SUTA te guide avec sa voix.</p><button class="continue" id="continue">▶️</button></div><div class="section textOptional">Choisis une histoire avec l’image</div><div class="rail" id="rail"></div></section><section id="detail" class="screen"><div class="window"><button class="back" onclick="goHome()">←</button><div id="content"></div></div></section></main><nav class="nav"><button onclick="goHome()">🏠</button><button onclick="sutaHelp()">🧑🏾‍🏫</button><button onclick="showProgress()">🏆</button></nav><script src="art/cartoon-v13.js"></script><script src="art/scenes-v13.js"></script><script src="content/stories-v13.js"></script><script src="content/ejustice-pilot-v13.js"></script><script src="content/narrative-pilots-v13.js"></script><script>const stories=window.PASS_STORIES||[],art=window.PASS_ART||{},sceneArt=window.PASS_SCENES||{};let progress=JSON.parse(localStorage.getItem('passProgress')||'{}'),activePilot=null,pilotIndex=0;const artKey={"Tata Nanti":"tata","Mariam":"mariam","Yao":"yao","Konan":"konan","Awa":"awa","Fatou":"fatou","Adama":"adama","Issa":"issa"};document.getElementById('sutaArt').innerHTML=art.suta||'';function personArtByName(name){return art[artKey[name]]||art.suta||''}function personArt(s){return personArtByName(s.character)}function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}function nextStory(){return stories.find(s=>!progress[s.id])||stories[0]}function pilotFor(id){if(id==='ejustice')return window.PASS_EJUSTICE_PILOT;return (window.PASS_NARRATIVE_PILOTS||{})[id]||null}function motionClass(id,i){const m={ejustice:['','anim-official','anim-lock','anim-wait','anim-doc'],money:['anim-money','anim-phone','anim-money','anim-lock','anim-doc'],'phone-photo':['anim-phone','anim-camera','anim-phone','anim-shot','anim-doc'],scam:['anim-phone','anim-alert','anim-link','','anim-shield']};return (m[id]||[])[i]||''}function card(s){let b=document.createElement('button');b.className='card';b.onclick=()=>openStory(s);b.innerHTML='<div class="art">'+personArt(s)+'</div><h3>'+s.character+'</h3><span class="badge">'+s.icon+' '+s.skill+'</span><br><button class="listenMini">🔊</button>';b.querySelector('.listenMini').onclick=e=>{e.stopPropagation();speak(s.character+'. '+s.intro)};return b}stories.forEach(s=>document.getElementById('rail').appendChild(card(s)));function welcomeVoice(){speak('Bonjour. Je suis SUTA. Touche le grand bouton vert pour continuer, ou touche un personnage.')}function refresh(){document.getElementById('continue').onclick=()=>openStory(nextStory())}function openStory(s){document.getElementById('home').classList.remove('on');document.getElementById('detail').classList.add('on');activePilot=pilotFor(s.id);if(activePilot){pilotIndex=0;renderPilot();return}renderBasic(s)}function renderPilot(){let p=activePilot,sc=p.scenes[pilotIndex],dots=p.scenes.map((x,i)=>'<i class="'+(i===pilotIndex?'on':'')+'"></i>').join(''),controls='',visual=(sceneArt[p.id]||[])[pilotIndex]||'',motion=motionClass(p.id,pilotIndex);if(sc.action==='choice')controls='<div class="pilotChoice">'+sc.choices.map((c,i)=>'<button onclick="pilotAnswer('+i+')">'+c.visual+'</button>').join('')+'</div>';else if(sc.action==='next')controls='<button class="sceneNext" onclick="pilotNext()">▶️</button>';else controls='<div class="celebrate">🎉</div><button class="sceneNext" onclick="finish(\''+p.id+'\')">✓</button>';document.getElementById('content').innerHTML='<div class="pilot"><div class="dots">'+dots+'</div><div class="stage"><div class="sceneArt '+motion+'">'+visual+'</div><div class="personBig art">'+personArtByName(p.character||'Adama')+'</div><div class="cue">'+sc.cue+'</div><div class="listenRow"><button class="primary" onclick="pilotSpeak()">🔊</button></div><p class="textOptional">'+sc.voice+'</p></div>'+controls+'</div>';setTimeout(()=>speak(sc.voice),300)}function pilotSpeak(){speak(activePilot.scenes[pilotIndex].voice)}function pilotNext(){pilotIndex=Math.min(pilotIndex+1,activePilot.scenes.length-1);renderPilot()}function pilotAnswer(i){let sc=activePilot.scenes[pilotIndex],c=sc.choices[i];speak(c.voice);if(c.good)setTimeout(pilotNext,700);else{let el=document.querySelectorAll('.pilotChoice button')[i];if(el){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),450)}setTimeout(()=>speak('Attention. Essaie l’autre image.'),650)}}function renderBasic(s){let visual=s.choices.map((c,i)=>'<button class="choice" data-i="'+i+'">'+((c.match(/^[^A-Za-zÀ-ÿ0-9]+/)||['●'])[0])+'<span>'+c+'</span></button>').join('');document.getElementById('content').innerHTML='<div class="scene"><div class="personBig art" style="margin-top:0">'+personArt(s)+'</div><div class="sceneIcon">'+s.icon+'</div><h3>'+s.character+'</h3><button class="primary" id="hear">🔊</button><p class="textOptional">'+s.intro+'</p></div><div class="choices">'+visual+'</div><div class="success" id="success"><div class="big">🎉</div><button onclick="finish(\''+s.id+'\')">✓</button><p class="textOptional">'+s.success+'</p></div>';document.getElementById('hear').onclick=()=>speak(s.intro+' '+s.problem);document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>answer(s,Number(x.dataset.i)));setTimeout(()=>speak(s.intro+' '+s.problem),350)}function answer(s,i){if(i===s.answer){document.getElementById('success').style.display='block';speak(s.success)}else speak('Essaie encore.')}function finish(id){progress[id]=true;localStorage.setItem('passProgress',JSON.stringify(progress));activePilot=null;speak('Bravo. Histoire terminée.');setTimeout(goHome,800)}function goHome(){document.getElementById('detail').classList.remove('on');document.getElementById('home').classList.add('on');activePilot=null;refresh()}function sutaHelp(){speak('Je suis SUTA. Touche le haut-parleur pour m’écouter et les grandes images pour choisir.')}function showProgress(){speak('Tu as terminé '+Object.keys(progress).length+' histoires.')}function toggleRead(){document.getElementById('app').classList.toggle('zeroRead');speak('Mode test sans lecture.')}refresh();setTimeout(welcomeVoice,600);</script></body></html>
