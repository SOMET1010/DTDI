<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PASS Academy</title><link rel="stylesheet" href="css/app.css"></head><body><div class="top"><span class="logo">P</span>PASS Academy<span class="ver">V1.3 Motion</span><button class="mode" onclick="toggleRead()">👁️</button></div><main class="wrap" id="app"><section id="home" class="screen on"><div class="welcome"><div class="sutaFace art" id="sutaArt"></div><button class="talk" onclick="welcomeVoice()">🔊</button><p class="textOptional">SUTA te guide avec sa voix.</p><button class="continue" id="continue">▶️</button></div><div class="section textOptional">Choisis une histoire avec l’image</div><div class="rail" id="rail"></div></section><section id="detail" class="screen"><div class="window"><button class="back" onclick="goHome()">←</button><div id="content"></div></div></section></main><nav class="nav"><button onclick="goHome()">🏠</button><button onclick="sutaHelp()">🧑🏾‍🏫</button><button onclick="showProgress()">🏆</button></nav><script src="art/cartoon-v13.js"></script><script src="art/scenes-v13.js"></script><script src="content/stories-v13.js"></script><script src="content/ejustice-pilot-v13.js"></script><script src="content/narrative-pilots-v13.js"></script><script src="js/audio.js"></script><script src="js/progress.js"></script><script src="js/navigation.js"></script><script src="js/renderers.js"></script><script>const stories=window.PASS_STORIES||[],art=window.PASS_ART||{},sceneArt=window.PASS_SCENES||{};let activePilot=null,pilotIndex=0;document.getElementById('sutaArt').innerHTML=art.suta||'';function nextStory(){return stories.find(s=>!progress[s.id])||stories[0]}function pilotFor(id){if(id==='ejustice')return window.PASS_EJUSTICE_PILOT;return (window.PASS_NARRATIVE_PILOTS||{})[id]||null}stories.forEach(s=>document.getElementById('rail').appendChild(card(s)));function openStory(s){document.getElementById('home').classList.remove('on');document.getElementById('detail').classList.add('on');activePilot=pilotFor(s.id);if(activePilot){pilotIndex=0;renderPilot();return}renderBasic(s)}function pilotSpeak(){speak(activePilot.scenes[pilotIndex].voice)}function pilotNext(){pilotIndex=Math.min(pilotIndex+1,activePilot.scenes.length-1);renderPilot()}function pilotAnswer(i){let sc=activePilot.scenes[pilotIndex],c=sc.choices[i];speak(c.voice);if(c.good)setTimeout(pilotNext,700);else{let el=document.querySelectorAll('.pilotChoice button')[i];if(el){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),450)}setTimeout(()=>speak('Attention. Essaie l’autre image.'),650)}}function answer(s,i){if(i===s.answer){document.getElementById('success').style.display='block';speak(s.success)}else speak('Essaie encore.')}function finish(id){progress[id]=true;localStorage.setItem('passProgress',JSON.stringify(progress));activePilot=null;speak('Bravo. Histoire terminée.');setTimeout(goHome,800)}refresh();setTimeout(welcomeVoice,600);</script></body></html>
