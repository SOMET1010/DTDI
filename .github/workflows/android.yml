name: Build PASS Academy Android

on:
  push:
    branches: ["pass-academy-v03"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tests de structure du contenu
        run: node tests/content-structure.test.js
      - name: Tests de compatibilité avec le contrat pédagogique
        run: node tests/pedagogical-contract-compatibility.test.js
      - name: Tests du mode zéro lecture
        run: node tests/zero-reading-mode.test.js
      - name: Tests de neutralité des cartes de choix
        run: node tests/choice-card-neutrality.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PASS-Academy-Android-v1.3.0-recette-zero-lecture-01.apk
      - name: Calculer le checksum SHA-256
        run: sha256sum PASS-Academy-Android-v1.3.0-recette-zero-lecture-01.apk | tee PASS-Academy-Android-v1.3.0-recette-zero-lecture-01.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PASS-Academy-Android-v1.3.0-recette-zero-lecture-01
          path: |
            PASS-Academy-Android-v1.3.0-recette-zero-lecture-01.apk
            PASS-Academy-Android-v1.3.0-recette-zero-lecture-01.apk.sha256
          if-no-files-found: error
