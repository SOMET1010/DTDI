name: Build PASS Academy Android

on:
  push:
    branches: ["pass-academy-v03"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tests de structure du contenu
        run: node tests/content-structure.test.js
      - name: Tests de compatibilité avec le contrat pédagogique
        run: node tests/pedagogical-contract-compatibility.test.js
      - name: Tests du mode zéro lecture
        run: node tests/zero-reading-mode.test.js
      - name: Tests de neutralité des cartes de choix
        run: node tests/choice-card-neutrality.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Diagnostic temporaire — vérifier les assets réellement packagés
        run: |
          echo "Commit buildé : $(git rev-parse HEAD)"
          rm -rf /tmp/apk-check && mkdir -p /tmp/apk-check
          unzip -o -q app/build/outputs/apk/debug/app-debug.apk -d /tmp/apk-check
          echo "--- assets/css/app.css : règle .welcome ---"
          grep -o '\.welcome{[^}]*}' /tmp/apk-check/assets/css/app.css || echo "INTROUVABLE"
          echo "--- assets/art/cartoon-v13.js : coiffure de mariam ---"
          grep -o 'mariam:.\{0,80\}' /tmp/apk-check/assets/art/cartoon-v13.js || echo "INTROUVABLE"
          echo "--- assets/art/tata-nanti/ ---"
          ls -la /tmp/apk-check/assets/art/tata-nanti/ 2>&1 || echo "DOSSIER ABSENT"
          echo "--- comparaison avec les fichiers sources du checkout ---"
          diff app/src/main/assets/css/app.css /tmp/apk-check/assets/css/app.css && echo "app.css IDENTIQUE" || echo "app.css DIFFERENT"
          diff app/src/main/assets/index.html /tmp/apk-check/assets/index.html && echo "index.html IDENTIQUE" || echo "index.html DIFFERENT"
      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PASS-Academy-Android-v1.3.0-recette-zero-lecture-01.apk
      - name: Calculer le checksum SHA-256
        run: sha256sum PASS-Academy-Android-v1.3.0-recette-zero-lecture-01.apk | tee PASS-Academy-Android-v1.3.0-recette-zero-lecture-01.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PASS-Academy-Android-v1.3.0-recette-zero-lecture-01
          path: |
            PASS-Academy-Android-v1.3.0-recette-zero-lecture-01.apk
            PASS-Academy-Android-v1.3.0-recette-zero-lecture-01.apk.sha256
          if-no-files-found: error
