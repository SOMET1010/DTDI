name: Build PASS Academy Android

on:
  push:
    branches: ["pass-academy-v03"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tests de structure du contenu
        run: node tests/content-structure.test.js
      - name: Tests de compatibilité avec le contrat pédagogique
        run: node tests/pedagogical-contract-compatibility.test.js
      - name: Tests du mode zéro lecture
        run: node tests/zero-reading-mode.test.js
      - name: Tests de neutralité des cartes de choix
        run: node tests/choice-card-neutrality.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Nommer l'APK avec le commit et la branche (évite les doublons ambigus)
        id: name
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_SLUG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          NAME="PASS-Academy-${BRANCH_SLUG}-${SHORT_SHA}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME.apk"
          sha256sum "$NAME.apk" | tee "$NAME.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            ${{ steps.name.outputs.name }}.apk
            ${{ steps.name.outputs.name }}.apk.sha256
          if-no-files-found: error
