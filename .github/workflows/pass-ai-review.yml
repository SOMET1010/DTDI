name: PASS AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENAI_REVIEW_MODEL: gpt-5.6
  OPENAI_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
  ANTHROPIC_CONFIGURED: ${{ secrets.ANTHROPIC_API_KEY != '' }}
  GH_PAT_CONFIGURED: ${{ secrets.GH_PAT != '' }}

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    outputs:
      needs_claude: ${{ steps.reviewer.outputs.needs_claude }}
      claude_prompt: ${{ steps.reviewer.outputs.claude_prompt }}
      anthropic_configured: ${{ steps.config.outputs.anthropic_configured }}
      gh_pat_configured: ${{ steps.config.outputs.gh_pat_configured }}
    steps:
      - name: Compute configuration flags
        id: config
        shell: bash
        run: |
          echo "anthropic_configured=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "gh_pat_configured=${{ secrets.GH_PAT != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Content structure tests
        id: content_tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .orchestrator/runtime
          set -o pipefail
          node tests/content-structure.test.js 2>&1 | tee .orchestrator/runtime/content-tests.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android debug build
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee .orchestrator/runtime/android-build.log

      - name: Enable KVM group perms
        if: steps.android_build.outcome == 'success'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture app screenshot on emulator
        id: emulator_capture
        if: steps.android_build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p .orchestrator/runtime/screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n ci.ansut.passacademy/.MainActivity
            sleep 8
            adb exec-out screencap -p > .orchestrator/runtime/screenshots/home.png
            adb logcat -d > .orchestrator/runtime/screenshots/logcat-full.txt || true

      - name: Prepare evidence summary
        shell: bash
        run: |
          {
            echo "content_structure_tests=${{ steps.content_tests.outcome }}"
            echo "android_debug_build=${{ steps.android_build.outcome }}"
            echo "apk_exists=$(test -f app/build/outputs/apk/debug/app-debug.apk && echo yes || echo no)"
            echo "emulator_capture=${{ steps.emulator_capture.outcome }}"
            echo "screenshot_exists=$(test -f .orchestrator/runtime/screenshots/home.png && echo yes || echo no)"
            echo "app_crashed_on_launch=$(grep -q 'FATAL EXCEPTION' .orchestrator/runtime/screenshots/logcat-full.txt 2>/dev/null && echo yes || echo no)"
            echo
            echo "--- content tests tail ---"
            tail -n 80 .orchestrator/runtime/content-tests.log || true
            echo
            echo "--- android build tail ---"
            tail -n 120 .orchestrator/runtime/android-build.log || true
          } > .orchestrator/runtime/test-summary.txt

      - name: Setup incomplete
        if: env.OPENAI_CONFIGURED != 'true' || env.ANTHROPIC_CONFIGURED != 'true' || env.GH_PAT_CONFIGURED != 'true'
        run: |
          echo '### PASS AI Orchestrator partially configured' >> "$GITHUB_STEP_SUMMARY"
          echo 'OPENAI_API_KEY, ANTHROPIC_API_KEY and GH_PAT are required for the full review/correction loop.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Without GH_PAT, Claude can still be asked to correct findings, but the push will not automatically trigger a new independent review (GITHUB_TOKEN pushes do not re-trigger pull_request workflows).' >> "$GITHUB_STEP_SUMMARY"

      - name: Independent ChatGPT review
        id: reviewer
        if: github.event_name == 'pull_request' && env.OPENAI_CONFIGURED == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .orchestrator/reviewer.mjs

      - name: Publish review to PR
        if: github.event_name == 'pull_request' && steps.reviewer.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file .orchestrator/runtime/review-comment.md

      - name: Upload machine-readable review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass-ai-review-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}
          path: .orchestrator/runtime/
          if-no-files-found: warn

  correct:
    needs: review
    if: >-
      github.event_name == 'pull_request' &&
      needs.review.outputs.needs_claude == 'true' &&
      needs.review.outputs.anthropic_configured == 'true' &&
      needs.review.outputs.gh_pat_configured == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      # No GH_PAT here on purpose: Claude must never hold write
      # credentials. persist-credentials: false means even the ambient
      # checkout token isn't left usable for a push — any push attempt
      # made from inside the next step simply fails for lack of auth.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Record pre-correction HEAD
        id: pre
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Claude corrects NOK findings (no write access)
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ needs.review.outputs.claude_prompt }}
          claude_args: |
            --max-turns 12
            --allowedTools "Edit,Read,Write,Bash(node tests/content-structure.test.js),Bash(gradle :app:assembleDebug:*),Bash(git status:*),Bash(git diff:*),GlobTool,GrepTool"

      # SEC-001 (human arbitration decision, see commit message): this is
      # now the ONLY step in the job that can decide a push happens, and
      # it decides BEFORE any credential exists to push with — nothing
      # protected can ever reach the remote branch, let alone trigger a
      # workflow run with secrets, even for a moment.
      - name: Validate scope before any push
        id: scope_guard
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_SHA="${{ steps.pre.outputs.sha }}"
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="pass-ai-orchestrator" -c user.email="actions@github.com" commit -m "wip: uncommitted correction changes" --no-verify
          fi
          AFTER_SHA=$(git rev-parse HEAD)
          if [ "$AFTER_SHA" = "$BEFORE_SHA" ]; then
            echo "Claude made no changes."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "violation=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          echo "Files changed by the correction:"
          echo "$CHANGED"
          FORBIDDEN_REGEX='(^|/)\.github/|(^|/)\.orchestrator/|docs/PASS-ACADEMY-PEDAGOGICAL-CONTRACT|docs/PASS-ACADEMY-UX-DOCTRINE|docs/pass-academy-story-contract|(^|/)\.env(\.|$)|secret|credential|\.pem$|\.key$'
          VIOLATIONS=$(printf '%s\n' "$CHANGED" | grep -Ei "$FORBIDDEN_REGEX" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "SCOPE VIOLATION — refusing to push"
            echo "$VIOLATIONS"
            echo "violation=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF_FILES"
              echo "$VIOLATIONS"
              echo "EOF_FILES"
            } >> "$GITHUB_OUTPUT"
          else
            echo "violation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the validated correction
        if: steps.scope_guard.outputs.has_changes == 'true' && steps.scope_guard.outputs.violation == 'false'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.pull_request.head.ref }}"
          BEFORE_SHA="${{ steps.pre.outputs.sha }}"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:refs/heads/$BRANCH" --force-with-lease="$BRANCH:$BEFORE_SHA"

      - name: Report scope violation and request human arbitration
        if: steps.scope_guard.outputs.violation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '<!-- PASS-AI-REVIEW protocol=v2 run=${{ github.repository }}#${{ github.event.pull_request.number }}@${{ github.event.pull_request.head.sha }} -->'
            echo '## ChatGPT QA — BLOCKED'
            echo
            echo "La correction proposée par Claude touchait des chemins protégés. Rien n'a été poussé — la branche n'a jamais bougé."
            echo
            echo '### SCOPE-001 — CRITICAL — FAIL'
            echo 'Correction automatique hors périmètre autorisé.'
            echo '**Localisation:**'
            echo '```'
            echo "${{ steps.scope_guard.outputs.files }}"
            echo '```'
            echo '**Correction demandée:** Traiter ce constat manuellement, hors boucle automatique.'
            echo
            echo '**Action:** REQUEST_HUMAN_ARBITRATION'
          } > /tmp/scope-violation.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/scope-violation.md

      - name: Fail the job on scope violation
        if: steps.scope_guard.outputs.violation == 'true'
        run: exit 1
