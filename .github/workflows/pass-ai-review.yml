name: PASS AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENAI_REVIEW_MODEL: gpt-5.6
  OPENAI_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
  ANTHROPIC_CONFIGURED: ${{ secrets.ANTHROPIC_API_KEY != '' }}

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    outputs:
      needs_claude: ${{ steps.reviewer.outputs.needs_claude }}
      claude_prompt: ${{ steps.reviewer.outputs.claude_prompt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Content structure tests
        id: content_tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .orchestrator/runtime
          set -o pipefail
          node tests/content-structure.test.js 2>&1 | tee .orchestrator/runtime/content-tests.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android debug build
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee .orchestrator/runtime/android-build.log

      - name: Prepare evidence summary
        shell: bash
        run: |
          {
            echo "content_structure_tests=${{ steps.content_tests.outcome }}"
            echo "android_debug_build=${{ steps.android_build.outcome }}"
            echo "apk_exists=$(test -f app/build/outputs/apk/debug/app-debug.apk && echo yes || echo no)"
            echo
            echo "--- content tests tail ---"
            tail -n 80 .orchestrator/runtime/content-tests.log || true
            echo
            echo "--- android build tail ---"
            tail -n 120 .orchestrator/runtime/android-build.log || true
          } > .orchestrator/runtime/test-summary.txt

      - name: Setup incomplete
        if: env.OPENAI_CONFIGURED != 'true' || env.ANTHROPIC_CONFIGURED != 'true'
        run: |
          echo '### PASS AI Orchestrator partially configured' >> "$GITHUB_STEP_SUMMARY"
          echo 'OPENAI_API_KEY and ANTHROPIC_API_KEY are required for the full review/correction loop.' >> "$GITHUB_STEP_SUMMARY"

      - name: Independent ChatGPT review
        id: reviewer
        if: github.event_name == 'pull_request' && env.OPENAI_CONFIGURED == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .orchestrator/reviewer.mjs

      - name: Publish review to PR
        if: github.event_name == 'pull_request' && steps.reviewer.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file .orchestrator/runtime/review-comment.md

      - name: Upload machine-readable review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass-ai-review-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}
          path: .orchestrator/runtime/
          if-no-files-found: warn

  correct:
    needs: review
    if: >-
      github.event_name == 'pull_request' &&
      needs.review.outputs.needs_claude == 'true' &&
      secrets.ANTHROPIC_API_KEY != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Claude corrects NOK findings
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ needs.review.outputs.claude_prompt }}
          claude_args: |
            --max-turns 12
            --allowedTools "Edit,Read,Write,Bash(node tests/content-structure.test.js),Bash(gradle :app:assembleDebug:*),Bash(git status:*),Bash(git diff:*),GlobTool,GrepTool"
